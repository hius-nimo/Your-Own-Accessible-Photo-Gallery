<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body onload="addTabAttributes()">
    <h1>Interactive Photo Gallery</h1>

    <div id="image">Hover over an image below to display here.</div>

    <div class="gallery">
      <div class="preview">
        <img
          src="logo.jpg"
          alt="FC Barcelona Action 1"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />
      </div>

      <div class="preview">
        <img
          src="barcelona.jpg"
          alt="FC Barcelona Action 2"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />
      </div>

      <div class="preview">
        <img
          src="Barcelona.webp"
          alt="FC Barcelona Action 3"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />
      </div>

      <div class="preview">
        <img
          src="Barcedona1.jpg"
          alt="FC Barcelona Action 4"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />
      </div>

      <div class="preview">
        <img
          src="barcedona.png"
          alt="FC Barcelona Team 1"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />
      </div>

      <div class="preview">
        <img
          src="barcelona.png"
          alt="FC Barcelona Team 2"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
